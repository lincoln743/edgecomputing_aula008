; ============================================================================
;  FIAP - Edge Computing - Aula 08 - Interrupcoes e o botao push
;  Placa: ESP32 DevKit v1 (esp32dev) | Framework: Arduino | Simulacao: Wokwi
;
;  Compila o sketch.ino da raiz para o firmware que o wokwi.toml carrega:
;      pio run              (compila)
;      pio run -t upload    (grava na placa fisica)
; ============================================================================
[platformio]
; O sketch desta aula virou sketch.ino na raiz do projeto - e o mesmo arquivo
; usado pelo editor do Wokwi - por isso o diretorio de fontes e a raiz.
src_dir = .

[env:esp32dev]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags   = -DCORE_DEBUG_LEVEL=0

; Compila somente o sketch da aula. O PlatformIO converte sketch.ino em
; sketch.ino.cpp (gerado na raiz durante o build) e e esse .cpp que entra na
; compilacao. O filtro impede que a varredura desca em .pio/ e .git/.
build_src_filter = +<sketch.ino> +<sketch.ino.cpp> -<.pio/> -<.git/> -<.vscode/>

; Nenhuma biblioteca externa: o sketch usa apenas o core do Arduino (ESP32).
; As bibliotecas do Serial Monitor e do buzzer ja vem no framework.
lib_deps =
